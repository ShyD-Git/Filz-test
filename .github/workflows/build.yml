name: Build QA Utils

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        brew install ldid xz dpkg
        export THEOS=$HOME/theos
        
        # Tối ưu Git để không bị timeout khi kéo file nặng
        git config --global http.postBuffer 524288000
        git config --global http.version HTTP/1.1
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        
        # Clone Theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # Xóa thư mục sdks rỗng/conflict do Theos tạo ra
        rm -rf $THEOS/sdks
        
        # Clone SDK kèm cơ chế tự động Retry (thử lại 3 lần nếu rớt mạng)
        echo "Bắt đầu clone SDK..."
        count=0
        until git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks || [ $count -eq 3 ]; do
          count=$((count+1))
          echo "Lỗi mạng, đang thử lại lần $count/3 sau 5 giây..."
          rm -rf $THEOS/sdks
          sleep 5
        done

    - name: Compile Utils
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: QATestingUtils-dylib
        path: .theos/obj/**/*.dylib
        if-no-files-found: error
