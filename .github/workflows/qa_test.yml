name: QA Build Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install lief gdown
        brew install ldid zip

    - name: Fetch Source Package
      run: |
        source venv/bin/activate
        gdown "https://drive.google.com/uc?id=1uJ7ZLtctizOFezk4zbpKUhGVTNnkYG4-" -O app.ipa || gdown "https://drive.google.com/file/d/1uJ7ZLtctizOFezk4zbpKUhGVTNnkYG4-/view?usp=drivesdk" -O app.ipa
        if [ ! -f app.ipa ]; then
          echo "Lỗi: Không tải được file từ Drive!"
          exit 1
        fi

    - name: Extract & Patch Binary
      run: |
        unzip app.ipa -d extracted_payload
        mkdir -p Payload
        mv extracted_payload/Payload/TempMail.app Payload/
        
        source venv/bin/activate
        python patch_binary.py

    - name: Repack & Sign
      run: |
        # Ký ad-hoc toàn bộ file thực thi bên trong App Bundle
        find Payload/TempMail.app -type f -perm +111 -exec ldid -S {} \;
        
        rm -rf extracted_payload
        zip -r QA_TempMail.ipa Payload/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QA-TempMail-IPA
        path: QA_TempMail.ipa
